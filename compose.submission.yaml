# Local configuration draft. No Docker build, public deployment or acceptance performed.
services:
  research:
    build:
      context: .
      dockerfile: Dockerfile.submission
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      RESEARCH_DATA_DIR: /data
      RESEARCH_MODEL_BASE_URL: ${RESEARCH_MODEL_BASE_URL:-https://api.deepseek.com}
      RESEARCH_MODEL: ${RESEARCH_MODEL:-deepseek-flash}
      RESEARCH_MODEL_API_KEY: ${RESEARCH_MODEL_API_KEY:-}
      RESEARCH_OCR_ENABLED: "0"
      RESEARCH_SEMANTIC_ENABLED: "0"
    volumes:
      - research_data:/data
volumes:
  research_data:
